name: Build Hyouka Browser
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git defaults
        run: |
          set -euo pipefail
          printf '[init]\n\tdefaultBranch = main\n' > "$RUNNER_TEMP/hyouka-gitconfig"
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/hyouka-gitconfig
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: |
          set -euo pipefail
          rm -rf /tmp/hyouka-browser-platform
          flutter create /tmp/hyouka-browser-platform \
            --platforms=android \
            --org com.hyouka.browser \
            --project-name hyouka_browser
          rm -rf android
          cp -a /tmp/hyouka-browser-platform/android ./android
      - name: Configure Gradle for CI
        run: |
          set -euo pipefail
          printf '\norg.gradle.vfs.watch=false\n' >> android/gradle.properties
      - name: Verify application source was preserved
        run: |
          set -euo pipefail
          test -s lib/main.dart
          grep -q "class BrowserApp" lib/main.dart
          grep -q "adblocker_webview" pubspec.yaml
          grep -q "dio" pubspec.yaml
          grep -q "path_provider" pubspec.yaml
          grep -q "shared_preferences" pubspec.yaml
      - name: Add internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          permission='    <uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              s=s.replace(marker, marker+"\n"+permission, 1)
          s=s.replace('android:label="hyouka_browser"', 'android:label="Hyouka Browser"')
          p.write_text(s)
          PY
      - run: dart format lib test
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build arm64-v8a only
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Verify arm64-v8a only
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$APK"
          test "$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*.apk' -type f | wc -l)" -eq 1
          test -z "$(unzip -Z1 "$APK" | grep -E '^lib/(armeabi-v7a|x86|x86_64|mips|mips64)/' || true)"
          test "$(unzip -Z1 "$APK" | grep -c '^lib/arm64-v8a/' || true)" -gt 0
          sha256sum "$APK"
      - uses: actions/upload-artifact@v7
        with:
          name: hyouka-browser-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.3.0-build-${{ github.run_number }}" build/app/outputs/flutter-apk/app-arm64-v8a-release.apk --title "Hyouka Browser v1.3.0-build-${{ github.run_number }}" --notes "Flutter browser; pure black UI; search; history; Dart downloads with visible progress; EasyList/AdGuard blocking; arm64-v8a only."
