name: Build Hyouka Browser
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android
        run: flutter create . --platforms=android --org com.hyouka.browser --project-name hyouka_browser --overwrite
      - name: Add internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />')
          s=s.replace('android:label="hyouka_browser"','android:label="Hyouka Browser"')
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build arm64-v8a only
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Verify arm64-v8a only
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$APK"
          test "$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*.apk' -type f | wc -l)" -eq 1
          test -z "$(unzip -Z1 "$APK" | grep -E '^lib/(armeabi-v7a|x86|x86_64|mips|mips64)/' || true)"
          test "$(unzip -Z1 "$APK" | grep -c '^lib/arm64-v8a/' || true)" -gt 0
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: hyouka-browser-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.0-build-${{ github.run_number }}" build/app/outputs/flutter-apk/app-arm64-v8a-release.apk --title "Hyouka Browser v1.0.0-build-${{ github.run_number }}" --notes "Flutter browser; arm64-v8a only."
