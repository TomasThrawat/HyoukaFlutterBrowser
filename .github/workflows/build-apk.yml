name: Build Hyouka Browser
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false

    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter Android wrapper
        run: |
          set -euo pipefail
          rm -rf /tmp/hyouka-browser-platform
          flutter create /tmp/hyouka-browser-platform \
            --platforms=android \
            --org com.hyouka.browser \
            --project-name hyouka_browser
          rm -rf android
          cp -a /tmp/hyouka-browser-platform/android ./android

      - name: Apply pure-black launcher icon
        run: |
          set -euo pipefail
          ICON=assets/pureblack_icon.png
          test -s "$ICON"
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable-nodpi" "$RES/mipmap-mdpi" "$RES/mipmap-hdpi" "$RES/mipmap-xhdpi" "$RES/mipmap-xxhdpi" "$RES/mipmap-xxxhdpi"
          find "$RES" -type f \( -name 'ic_launcher*.png' -o -name 'ic_launcher*.webp' -o -name 'ic_launcher*.xml' \) -delete
          cp "$ICON" "$RES/drawable-nodpi/pureblack_icon.png"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "$ICON" "$RES/mipmap-$density/ic_launcher.png"
            cp "$ICON" "$RES/mipmap-$density/ic_launcher_round.png"
          done

      - name: Apply native Android download bridge
        run: |
          set -euo pipefail
          NATIVE_DIR=android/app/src/main/kotlin/com/hyouka/browser/hyouka_browser
          test -s android_native/MainActivity.kt
          test -s "$NATIVE_DIR/MainActivity.kt"
          rm "$NATIVE_DIR/MainActivity.kt"
          cp android_native/MainActivity.kt "$NATIVE_DIR/MainActivity.kt"

      - name: Configure Gradle for CI
        run: |
          set -euo pipefail
          printf '\norg.gradle.vfs.watch=false\n' >> android/gradle.properties

      - name: Configure Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              s = s.replace(marker, marker + "\n" + permission, 1)
          s = s.replace('android:label="hyouka_browser"', 'android:label="Hyouka Browser"')
          p.write_text(s)
          PY

      - name: Verify hybrid Android bridge
        run: |
          set -euo pipefail
          NATIVE=android/app/src/main/kotlin/com/hyouka/browser/hyouka_browser/MainActivity.kt
          test -s "$NATIVE"
          grep -q 'package com.hyouka.browser.hyouka_browser' "$NATIVE"
          grep -q 'class MainActivity' "$NATIVE"
          grep -q 'MethodChannel' "$NATIVE"
          grep -q 'DownloadManager' "$NATIVE"
          grep -q 'native_downloads' lib/main.dart
          ! grep -qE 'dio:|path_provider:' pubspec.yaml
          test "$(find android/app/src/main/kotlin -name 'MainActivity.kt' -type f | wc -l)" -eq 1

      - name: Verify application source
        run: |
          set -euo pipefail
          test -s lib/main.dart
          grep -q "class BrowserApp" lib/main.dart
          grep -q "adblocker_webview" pubspec.yaml
          grep -q "shared_preferences" pubspec.yaml

      - run: dart format lib test
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build arm64-v8a only
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Verify release APK
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$APK"
          test "$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*.apk' -type f | wc -l)" -eq 1
          test -z "$(unzip -Z1 "$APK" | grep -E '^lib/(armeabi-v7a|x86|x86_64|mips|mips64)/' || true)"
          test "$(unzip -Z1 "$APK" | grep -c '^lib/arm64-v8a/' || true)" -gt 0
          test "$(unzip -Z1 "$APK" | grep -cE '^classes[0-9]*\.dex$' || true)" -gt 0

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.hyouka.browser.hyouka_browser'"
          printf '%s\n' "$BADGING" | grep -Fq "application-label:'Hyouka Browser'"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v7
        with:
          name: hyouka-browser-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: //p' pubspec.yaml | cut -d+ -f1)"
          TAG="v${VERSION}-build-${{ github.run_number }}"
          gh release create \
            "$TAG" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            --title "Hyouka Browser $TAG" \
            --notes "Flutter UI/state + small Android DownloadManager bridge; pure black UI; search; history; EasyList/AdGuard plus explicit tracker/ad domain blocking; visible download progress; adblock toggle and statistics; automatic Google unusual-traffic fallback; arm64-v8a only."
