name: hyouka_browser
description: A native Flutter Android browser with search, history, downloads, and ad blocking.
publish_to: "none"
version: 1.2.0+3
environment:
  sdk: ">=3.10.1 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  adblocker_webview: ^2.3.0
  flutter_file_downloader: ^2.1.1
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
